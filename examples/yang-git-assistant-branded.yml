# INTERNAL ONLY — YangYang-Research org repos.
#
# Do NOT publish APP_ID / PRIVATE_KEY to Marketplace users.
# Public setup: examples/yang-git-assistant.yml (github.token → github-actions[bot]).
#
# This workflow mints an installation token so comments post as
# yang-git-assistant[bot]. Requires org secrets:
#   - YANG_GIT_ASSISTANT_APP_ID
#   - YANG_GIT_ASSISTANT_APP_PRIVATE_KEY
#   - YANG_API_TOKEN

name: Yang Git Assistant (YGA)

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  supervise:
    runs-on: ubuntu-24.04
    steps:
      - name: Mint yang-git-assistant app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.YANG_GIT_ASSISTANT_APP_ID }}
          private-key: ${{ secrets.YANG_GIT_ASSISTANT_APP_PRIVATE_KEY }}

      - name: yang-git-assistant
        uses: YangYang-Research/yang-git-assistant@v0.1.1
        with:
          PROVIDER: yangyang
          API_KEY: ${{ secrets.YANG_API_TOKEN }}
          MODEL_NAME: auto
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
